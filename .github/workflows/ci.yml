# 書式・Lint・テストを windows-latest で通す。
#
# テストは同梱サンプルと tests/fixtures/full-config.txt の両方をパースするので、
# 設定ファイルの書式エラーもここで落ちる。仕上げに、ビルドした exe で --check を
# 実行して実際の終了コードまで確かめる。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 書式・Lint・テスト
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Rust ツールチェーンを用意
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - name: 書式
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: テスト
        run: cargo test

      # ダイアログを実際に出して操作するテスト（prompt / progress）と、
      # 実プロセスの終了を待つテスト（launch）。**題名でウィンドウを探すので
      # 直列に走らせる。** ローカルでは 5 秒ほどで終わるので、固まったときに
      # 6 時間ぶら下がらないよう時間で頭打ちにしておく。
      #
      # 手で叩く前提のテストは、いずれ叩かれなくなる。DLGTEMPLATE の組み立てを
      # 誤ると DialogBoxIndirectParamW が -1 を返すだけで、ほかに気づく手段が
      # 無いため、ここで毎回通す価値がある。
      - name: 画面が要るテスト
        timeout-minutes: 5
        run: cargo test -- --ignored --test-threads=1

      - name: リリースビルド
        run: cargo build --release

      # exe ごとにリソースを分けているのが崩れていないか。
      #
      # embed_resource::compile はすべての bin にリンクするので、compile_for を
      # 戻すと extrun-make.exe に extrun.exe の名前が入り、**視覚スタイルの
      # マニフェストが extrun.exe にも入る**。マニフェストが入ると comctl32 v6 が
      # 起動時に読み込まれ、「起動速度が最優先」という前提が静かに崩れる。
      # 見た目では気づけないので、ここで見張る。
      - name: exe ごとのリソースを確認
        run: |
          $expected = @{ 'extrun.exe' = 'extrun.exe'; 'extrun-make.exe' = 'extrun-make.exe' }
          foreach ($name in $expected.Keys) {
            $path = "./target/release/$name"
            $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).OriginalFilename
            if ($actual -ne $expected[$name]) {
              throw "$name の OriginalFilename が $actual になっています（$($expected[$name]) のはず）"
            }
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
            $manifest = $text -match 'Microsoft\.Windows\.Common-Controls'
            $wanted = ($name -eq 'extrun-make.exe')
            if ($manifest -ne $wanted) {
              throw "$name のマニフェストが期待と違います（あり=$manifest、期待=$wanted）"
            }
          }

      - name: 設定ファイルを --check で検証
        # extrun.exe はコンソールを持たないため、pwsh は終了を待たない。
        # 終了コードを見るには Start-Process -Wait -PassThru を使う。
        #
        # 同梱するサンプル（最小限）と、書式を一通り使ったフィクスチャの両方。
        run: |
          foreach ($config in 'extrun-config.txt', 'tests/fixtures/full-config.txt') {
            $proc = Start-Process ./target/release/extrun.exe -ArgumentList '--check', '--config', $config -Wait -PassThru -NoNewWindow
            if ($proc.ExitCode -ne 0) {
              throw "$config にエラーがあります (exit $($proc.ExitCode))"
            }
          }
