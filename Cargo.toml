[package]
name = "extrun"
version = "1.4.0"
edition = "2021"
# 1.77.2 は `.bat` / `.cmd` を `cmd.exe /c` 経由で起動する際の引数の
# エスケープが直った版（CVE-2024-24576）。設定ファイルにバッチを直接
# 書ける前提はこの挙動に依存する
rust-version = "1.77.2"
description = "拡張子に関連付けられたコンテキストメニューから、ファイルやフォルダを開く Windows 用ランチャー"
repository = "https://github.com/pirukabocha/extrun"
license = "MIT"
readme = "README.md"
keywords = ["windows", "launcher", "contextmenu", "shell", "win32"]
categories = ["command-line-utilities", "os::windows-apis"]
# 配布は GitHub Releases の zip なので crates.io には公開しない
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_IO",
    # 中止したときに残りのパスをクリップボードへ渡すため（ファイルは書かない）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    # :admin の ShellExecuteExW 用（COM の初期化と SHELLEXECUTEINFOW の hkeyClass）
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "extrun"
path = "src/main.rs"

# exe に VERSIONINFO を埋め込むためだけのビルド時依存。
# 実行時の依存は windows-sys のみで、バイナリサイズにも影響しない。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"
